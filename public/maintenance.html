<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We're Preparing Something Sweet — BeesBee</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body class="bg-[#FAF7F2] text-[#2B1810] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl p-8 text-center border border-[#EDE4D3] shadow-xl relative overflow-hidden">
    <!-- Amber glow behind logo -->
    <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-48 h-48 bg-amber-200/40 rounded-full blur-2xl pointer-events-none"></div>

    <img 
      src="assets/images/logo.png" 
      alt="BeesBee" 
      class="h-20 object-contain mx-auto relative z-10"
      onerror="this.src='assets/images/mockup_reference.png'"
    />

    <div class="mt-6 text-4xl animate-bounce">
      🍯
    </div>

    <h1 class="text-2xl font-bold font-serif-brand text-stone-900 mt-4 leading-tight">
      We’re preparing something sweet
    </h1>

    <p class="text-xs sm:text-sm text-stone-600 mt-2 font-medium leading-relaxed">
      BeesBee will be back shortly. Our team is currently bottling fresh forest batches and updating our hive.
    </p>

    <div class="mt-6 p-3 bg-amber-50 rounded-2xl border border-amber-200/80 text-xs text-amber-900 font-semibold flex items-center justify-center gap-2">
      <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
      Expected return: Within a few moments
    </div>

    <!-- WhatsApp inquiry during maintenance -->
    <div class="mt-6">
      <a 
        href="https://wa.me/919876543210?text=Hi%20BeesBee!%20I%20noticed%20the%20website%20is%20updating.%20Can%20I%20place%20an%20order%20directly%20here%3F" 
        target="_blank" 
        class="whatsapp-btn font-bold text-xs py-3 px-6 rounded-2xl inline-flex items-center gap-2 shadow-md">
        <span>Order Directly on WhatsApp</span>
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.699c.974.57 1.942.87 3.027.87 3.18 0 5.767-2.587 5.767-5.766.001-3.182-2.586-5.766-5.768-5.766z"/></svg>
      </a>
    </div>

    <div class="mt-8 pt-4 border-t border-stone-100 text-[11px] text-stone-400">
      Pure Honey. Straight From Nature.
    </div>
  </div>
</body>
</html>
